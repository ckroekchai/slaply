[package]
name = "slaply_resvg"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
resvg = { version = "=0.49.0", default-features = false }
roxmltree = "=0.21.2"
svgtypes = "=0.16.2"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
codegen-units = 1
